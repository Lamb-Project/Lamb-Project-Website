<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" role="img" aria-labelledby="title desc"><title id="title">How the LMS, tool and LAMB connect</title><desc id="desc">The LMS sends a signed launch to the tool. The tool calls LAMB with a server-side creator key. The instructor approves grades that the tool returns to the LMS.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#356cb1" stroke-width="2"/></marker></defs><rect width="1100" height="410" rx="20" fill="#f1f5fb"/><g font-family="system-ui,sans-serif" fill="#183451"><text x="36" y="45" font-size="25" font-weight="700">One activity, three services</text><g stroke="#c4d4e7" fill="white"><rect x="35" y="95" width="245" height="165" rx="12"/><rect x="425" y="95" width="250" height="165" rx="12"/><rect x="820" y="95" width="245" height="165" rx="12"/></g><g text-anchor="middle"><text x="158" y="136" font-size="23" font-weight="700">Your LMS</text><text x="158" y="171" font-size="17">Moodle or the test LMS</text><text x="158" y="206" font-size="17">Course · people · grades</text><text x="550" y="136" font-size="23" font-weight="700">Your tool</text><text x="550" y="171" font-size="17">FastAPI · chat · activities</text><text x="550" y="206" font-size="17">SQLite · LTI · sessions</text><text x="942" y="136" font-size="23" font-weight="700">LAMB</text><text x="942" y="171" font-size="17">Published assistant</text><text x="942" y="206" font-size="17">Prompt · knowledge · model</text><text x="352" y="107" font-size="15">Signed launch</text><text x="747" y="107" font-size="15">Creator API key</text><text x="747" y="238" font-size="15">Streamed answer</text><text x="352" y="238" font-size="15">Approved grade</text></g><g stroke="#356cb1" stroke-width="2.5" marker-end="url(#a)"><path d="M288 131H415"/><path d="M683 131H810"/><path d="M811 209H686"/><path d="M417 209H290"/></g><text x="36" y="312" font-size="18" font-weight="700">Two different credentials</text><text x="36" y="345" font-size="17">LTI shared secret: LMS ↔ tool.  Personal API key: tool ↔ LAMB.</text><text x="36" y="378" font-size="17">The browser receives a tool session. The LAMB key stays on the tool server.</text></g></svg>
