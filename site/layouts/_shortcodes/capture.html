<figure class="lamb-capture">
 <a href="{{ .Get "src" }}" aria-label="{{ T "openFullSize" }} {{ .Get "alt" }}"><img src="{{ .Get "src" }}" alt="{{ .Get "alt" }}" loading="lazy" width="1280"></a>
 <figcaption>{{ .Get "caption" }} <a href="{{ printf "guides/%s/screenshots/" (.Page.Params.documentationVersion | default site.Data.documentation.current) | relLangURL }}">{{ T "captureDetails" }}</a> · <a href="{{ .Get "src" }}">{{ T "fullSize" }}</a></figcaption>
</figure>
