<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d" font-family="Inter, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<title id="t">The last mile for your AI</title>
<desc id="d">Your AI infrastructure gives LAMB the authorised models. The LMS tells LAMB, through LTI, who is enrolled, in which course, with which role and in which school. LAMB's AI governance layer applies the organization's rules and the teacher's activity settings and gives each person a scoped key. In LAMB 0.8 it governs students' own tools; assistants, LAMB LEGATUS and learning apps are in design.</desc>
<defs>
<marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/></marker>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2271b3"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a3"/></marker>
</defs>
<rect width="1200" height="800" fill="#ffffff"/>

<!-- Infrastructure -->
<rect x="390" y="16" width="420" height="104" rx="12" fill="#eef0f3" stroke="#9ca3af" stroke-width="2.5"/>
<text x="600" y="60" text-anchor="middle" font-size="28" font-weight="700" fill="#1f2937">Your AI infrastructure</text>
<text x="600" y="94" text-anchor="middle" font-size="22" fill="#4b5563">local models, GPUs, providers</text>
<path d="M600,124 L600,190" stroke="#1f2937" stroke-width="3" marker-end="url(#ai)"/>
<text x="616" y="166" font-size="21" font-weight="600" fill="#1f2937">authorized models</text>

<!-- LMS -->
<rect x="16" y="246" width="290" height="208" rx="12" fill="#fdf1e2" stroke="#e08a1e" stroke-width="2.5"/>
<text x="161" y="292" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Your LMS</text>
<text x="161" y="326" text-anchor="middle" font-size="20" fill="#4b5563">who is enrolled,</text>
<text x="161" y="354" text-anchor="middle" font-size="20" fill="#4b5563">in which course,</text>
<text x="161" y="382" text-anchor="middle" font-size="20" fill="#4b5563">with which role,</text>
<text x="161" y="410" text-anchor="middle" font-size="20" fill="#4b5563">in which school</text>
<path d="M310,350 L382,350" stroke="#1f2937" stroke-width="3" marker-end="url(#ai)"/>
<text x="346" y="334" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2937">LTI</text>

<!-- LAMB -->
<rect x="390" y="196" width="420" height="310" rx="14" fill="#2271b3"/>
<text x="600" y="238" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">LAMB</text>
<text x="600" y="268" text-anchor="middle" font-size="20" fill="#dbeafe">AI governance layer</text>
<rect x="414" y="286" width="372" height="62" rx="10" fill="#ffffff"/>
<text x="600" y="313" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Organization rules</text>
<text x="600" y="337" text-anchor="middle" font-size="18" fill="#4b5563">models, policy, teacher allowances</text>
<rect x="414" y="356" width="372" height="62" rx="10" fill="#ffffff"/>
<text x="600" y="383" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Teacher's activity</text>
<text x="600" y="407" text-anchor="middle" font-size="18" fill="#4b5563">student limits and timetable</text>
<rect x="414" y="426" width="372" height="62" rx="10" fill="#ffffff"/>
<text x="600" y="453" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Gateway</text>
<text x="600" y="477" text-anchor="middle" font-size="18" fill="#4b5563">a scoped key, every token counted</text>

<!-- The four rights -->
<text x="840" y="300" font-size="24" font-weight="700" fill="#2271b3">the right model</text>
<text x="840" y="336" font-size="24" font-weight="700" fill="#2271b3">to the right person</text>
<text x="840" y="372" font-size="24" font-weight="700" fill="#2271b3">in the right amount</text>
<text x="840" y="408" font-size="24" font-weight="700" fill="#2271b3">at the right time</text>

<!-- Consumers -->
<path d="M560,510 L230,590" stroke="#2271b3" stroke-width="3" marker-end="url(#ab)"/>
<path d="M600,510 L580,590" stroke="#8a94a3" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ag)"/>
<path d="M630,510 L830,590" stroke="#8a94a3" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ag)"/>
<path d="M660,510 L1070,590" stroke="#8a94a3" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#ag)"/>

<rect x="16" y="596" width="430" height="112" rx="12" fill="#ffffff" stroke="#2271b3" stroke-width="3"/>
<text x="231" y="636" text-anchor="middle" font-size="24" font-weight="700" fill="#1f2937">Students' own tools</text>
<text x="231" y="666" text-anchor="middle" font-size="18" fill="#4b5563">copilots, CLI harnesses, any</text>
<text x="231" y="690" text-anchor="middle" font-size="18" fill="#4b5563">OpenAI-compatible tool</text>

<rect x="470" y="596" width="220" height="112" rx="12" fill="#ffffff" stroke="#8a94a3" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="580" y="660" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Assistants</text>

<rect x="714" y="596" width="220" height="112" rx="12" fill="#ffffff" stroke="#8a94a3" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="824" y="646" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">LAMB</text>
<text x="824" y="676" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">LEGATUS</text>

<rect x="958" y="596" width="226" height="112" rx="12" fill="#ffffff" stroke="#8a94a3" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="1071" y="646" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">Learning</text>
<text x="1071" y="676" text-anchor="middle" font-size="23" font-weight="700" fill="#1f2937">apps</text>

<!-- Legend -->
<path d="M300,760 L360,760" stroke="#2271b3" stroke-width="3"/>
<text x="372" y="767" font-size="20" fill="#1f2937">governed in LAMB 0.8</text>
<path d="M640,760 L700,760" stroke="#8a94a3" stroke-width="2.5" stroke-dasharray="8 7"/>
<text x="712" y="767" font-size="20" fill="#1f2937">in design</text>
</svg>
